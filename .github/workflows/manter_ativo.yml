name: Manter ativo

# Uma vez por dia grava só a data/hora em batimento.txt (nada da carteira).
# Isso conta como atividade no repositório e impede o GitHub de desligar o
# Sinal SOL v4 depois de 60 dias sem atividade.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 12 * * *"

permissions:
  contents: write

jobs:
  batimento:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gravar batimento
        run: |
          TZ=America/Sao_Paulo date "+%d/%m/%Y %H:%M:%S (Brasília)" > batimento.txt
          git config user.name "sinal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add batimento.txt
          git commit -m "batimento" || exit 0
          git push
